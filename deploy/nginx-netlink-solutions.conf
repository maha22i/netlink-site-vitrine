# Netlink Solutions - reverse proxy vers Next.js (127.0.0.1:3080).
# Fichier : /etc/nginx/sites-available/netlinksolutions.pro (lien dans sites-enabled).
#
# Phase 1 (DNS pas encore basculé) : HTTP uniquement.
# Phase 2 : une fois netlinksolutions.pro pointé sur ce serveur, exécuter
#   certbot --nginx -d netlinksolutions.pro -d www.netlinksolutions.pro --redirect
# Certbot ajoute le bloc 443, la redirection HTTP -> HTTPS et les certificats.

server {
    listen 80;
    listen [::]:80;
    server_name netlinksolutions.pro www.netlinksolutions.pro;

    access_log /var/log/nginx/netlink-solutions.access.log;
    error_log  /var/log/nginx/netlink-solutions.error.log;

    # Une seule adresse canonique (celle déclarée dans NEXT_PUBLIC_SITE_URL).
    if ($host = www.netlinksolutions.pro) {
        return 301 $scheme://netlinksolutions.pro$request_uri;
    }

    # CV en PDF limités à 5 Mo côté application.
    client_max_body_size 6M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Chatbot : la réponse arrive en flux (SSE), donc aucune mise en mémoire tampon.
    location = /api/chat {
        limit_req zone=netlink_chat burst=8 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;

        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }

    location /api/ {
        limit_req zone=netlink_forms burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
