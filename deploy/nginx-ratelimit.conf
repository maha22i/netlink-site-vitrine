# Zones propres à Netlink Solutions (noms préfixés pour ne pas entrer en collision avec les autres sites du serveur).
# Formulaires (contact, candidature) : 6 requêtes par minute et par adresse IP.
limit_req_zone $binary_remote_addr zone=netlink_forms:5m rate=6r/m;
# Chatbot : chaque message consomme des crédits Orkiva, on plafonne par adresse IP.
limit_req_zone $binary_remote_addr zone=netlink_chat:5m rate=20r/m;
